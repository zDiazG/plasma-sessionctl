# Generated baseline for plasmactl v0.4.2
# In systemd-run mode, do NOT set adapter_name/output_name here.
# GPU isolation is enforced by systemd DevicePolicy/DeviceAllow.

sunshine_name = WhiteDwarf
min_log_level = info
system_tray = disabled

address_family = ipv4
bind_address = 0.0.0.0
port = 47989
upnp = disabled
lan_encryption_mode = 0
wan_encryption_mode = 0
ping_timeout = 30000

keyboard = enabled
mouse = enabled
controller = enabled
gamepad = auto
high_resolution_scrolling = enabled
native_pen_touch = enabled

file_apps = plasmactl-apps-performance.json
credentials_file = sunshine_state.json
file_state = sunshine_state.json
pkey = credentials/cakey.pem
cert = credentials/cacert.pem

capture = kms
encoder = vaapi
hevc_mode = 1
av1_mode = 1
max_bitrate = 20000
minimum_fps_target = 60
fec_percentage = 5
qp = 14
min_threads = 2
vaapi_strict_rc_buffer = disabled
vk_rc_mode = 1
sw_preset = veryfast
sw_tune = zerolatency
