# Generated baseline for plasmactl v0.4.3
# Safe fallback profile; no adapter_name/output_name in systemd-run isolation mode.

sunshine_name = plasmactl-host
min_log_level = debug
system_tray = disabled

address_family = ipv4
bind_address = 0.0.0.0
port = 47989
upnp = disabled
lan_encryption_mode = 0
wan_encryption_mode = 0
ping_timeout = 30000

keyboard = enabled
mouse = enabled
controller = enabled
gamepad = auto
high_resolution_scrolling = enabled
native_pen_touch = enabled

file_apps = plasmactl-apps-safe.json
credentials_file = sunshine_state.json
file_state = sunshine_state.json
pkey = credentials/cakey.pem
cert = credentials/cacert.pem

capture = kms
encoder = software
hevc_mode = 1
av1_mode = 1
max_bitrate = 30000
minimum_fps_target = 60
fec_percentage = 20
qp = 23
sw_preset = superfast
sw_tune = zerolatency
